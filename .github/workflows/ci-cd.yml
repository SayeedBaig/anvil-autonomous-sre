name: Sentinel ONE — CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  BACKEND_SERVICE: sentinel-backend
  FRONTEND_SERVICE: sentinel-frontend
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev

jobs:
  # ─────────────────────────────────────
  # 1. Backend Tests
  # ─────────────────────────────────────
  test-backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        working-directory: backend
        run: |
          pip install ruff
          ruff check . --select E,W,F --ignore E501

      - name: Run tests
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key-32-chars-long!!
          DATABASE_URL: sqlite:///./test.db
          GEMINI_API_KEY: dummy-for-ci
          ALLOWED_ORIGINS: http://localhost:3000
        run: |
          python init_db.py
          pytest tests/ -v --tb=short --cov=. --cov-report=term-missing

  # ─────────────────────────────────────
  # 2. Frontend Tests
  # ─────────────────────────────────────
  test-frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build (production)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://sentinel-backend-placeholder.run.app
          NEXT_PUBLIC_SOCKET_URL: https://sentinel-backend-placeholder.run.app
        run: npm run build

  # ─────────────────────────────────────
  # 3. Deploy to GCP Cloud Run (main only)
  # ─────────────────────────────────────
  deploy:
    name: Deploy to GCP Cloud Run
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      id-token: write   # Required for Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }}

      # --- Backend ---
      - name: Build & Push Backend Image
        working-directory: backend
        run: |
          IMAGE="${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/sentinel/${{ env.BACKEND_SERVICE }}:${{ github.sha }}"
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "BACKEND_IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image ${{ env.BACKEND_IMAGE }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --set-secrets="SECRET_KEY=sentinel-secret-key:latest,GEMINI_API_KEY=gemini-api-key:latest" \
            --set-env-vars="ALLOWED_ORIGINS=https://${{ env.FRONTEND_SERVICE }}-${{ env.GCP_PROJECT_ID }}.run.app"

      - name: Get Backend URL
        run: |
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)')
          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV

      # --- Frontend ---
      - name: Build & Push Frontend Image
        working-directory: frontend
        run: |
          IMAGE="${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/sentinel/${{ env.FRONTEND_SERVICE }}:${{ github.sha }}"
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ env.BACKEND_URL }} \
            --build-arg NEXT_PUBLIC_SOCKET_URL=${{ env.BACKEND_URL }} \
            -t $IMAGE .
          docker push $IMAGE
          echo "FRONTEND_IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --image ${{ env.FRONTEND_IMAGE }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5

      - name: Print Deployment URLs
        run: |
          FRONTEND_URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)')
          echo "✅ Backend:  ${{ env.BACKEND_URL }}"
          echo "✅ Frontend: $FRONTEND_URL"
